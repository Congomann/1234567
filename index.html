    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #f0f4f8;
        background-image: 
          radial-gradient(at 0% 0%, hsla(215,98%,61%,0.15) 0px, transparent 50%),
          radial-gradient(at 100% 0%, hsla(250,98%,61%,0.15) 0px, transparent 50%);
        background-attachment: fixed;
        background-size: cover;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
      }
      
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(156, 163, 175, 0.3); 
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(107, 114, 128, 0.5); 
      }

      .animate-fade-in {
        animation: fadeIn 0.4s ease-out forwards;
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .animate-bounce-subtle {
        animation: bounceSubtle 0.5s cubic-bezier(0.36, 0, 0.66, -0.56) forwards;
      }

      @keyframes bounceSubtle {
        0% { transform: scale(0.3); opacity: 0; }
        50% { transform: scale(1.1); opacity: 1; }
        70% { transform: scale(0.9); }
        100% { transform: scale(1); opacity: 1; }
      }

      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* 3D FLOATING ANIMATIONS & VIBRANT GRADIENT SYSTEM */
      .apple-3d-card {
        transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        transform-style: preserve-3d;
      }
      .apple-3d-card:hover {
        transform: translateY(-8px) scale(1.02) rotateX(2deg);
        box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.25);
      }
      
      .animate-float-3d {
        animation: float3D 4s ease-in-out infinite;
      }
      @keyframes float3D {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(3deg); }
      }

      .gradient-cyan-card {
        background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
        color: #0f172a;
      }
      .gradient-yellow-card {
        background: linear-gradient(135deg, #ffe259 0%, #ffa751 100%);
        color: #0f172a;
      }
      .gradient-pink-card {
        background: linear-gradient(135deg, #f355da 0%, #8e2de2 100%);
        color: #ffffff;
      }

      /* APPLE DESIGN SYSTEM GLASSMORPHISM & UTILITIES */
      .apple-glass {
        background: rgba(255, 255, 255, 0.75);
        backdrop-filter: blur(24px) saturate(180%);
        -webkit-backdrop-filter: blur(24px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.8);
        box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.05);
      }
      .apple-glass-dark {
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(24px) saturate(180%);
        -webkit-backdrop-filter: blur(24px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 20px 50px -10px rgba(0, 0, 0, 0.4);
      }
      .apple-card {
        transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .apple-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 24px 48px -12px rgba(0, 0, 0, 0.08);
      }
      .pulse-glow-blue {
        box-shadow: 0 0 25px rgba(59, 130, 246, 0.3);
      }
      .pulse-glow-emerald {
        box-shadow: 0 0 25px rgba(16, 185, 129, 0.3);
      }
    </style>
