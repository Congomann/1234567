<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Rounded black background -->
  <rect width="120" height="120" rx="30" fill="#000000" />
  
  <!-- The house shape -->
  <path d="M 25,65 L 50,40 L 75,65 L 75,90 L 25,90 Z" fill="url(#houseGrad)" />
  
  <!-- The circle in the middle -->
  <circle cx="50" cy="65" r="12" fill="#ffffff" filter="url(#glow)" />

  <defs>
    <linearGradient id="houseGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#888888"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
</svg>
