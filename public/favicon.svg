<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="houseGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#e8e8e8"/>
      <stop offset="100%" stop-color="#808080"/>
    </linearGradient>
    <linearGradient id="circleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e0e0"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Black rounded background -->
  <rect width="400" height="400" rx="80" fill="#030303" />

  <!-- House Graphic -->
  <path d="M 50 220 
           L 50 170 
           L 85 135 
           L 115 165 
           L 150 120 
           L 180 150 
           L 180 220 Z" 
        fill="url(#houseGrad)" />

  <!-- Inner Circle -->
  <circle cx="95" cy="180" r="16" fill="url(#circleGrad)" filter="url(#dropShadow)" />

  <!-- Text: New Holland -->
  <text x="200" y="155" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="65" fill="#ffffff">New</text>
  <text x="200" y="220" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="65" fill="#ffffff">Holland</text>

  <!-- Text: FINANCIAL GROUP -->
  <text x="50" y="275" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="400" letter-spacing="4" fill="#a0a0a0">FINANCIAL GROUP</text>
</svg>
